[project]
name = "domino-game-cli"
version = "2.0.0"
description = "A beautiful CLI application to play Caribbean dominoes (2v2)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Chris" }
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 127
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "PT",  # flake8-pytest-style
    "RET",  # flake8-return
    "ARG",  # flake8-unused-arguments
    "PIE",  # flake8-pie
    "PERF",  # perflint
    "N",  # pep8-naming
    "FBT",  # flake8-boolean-trap: prefer keyword-only flags
    "TC",  # flake8-type-checking
]
ignore = [
    "E501",  # line too long, handled by formatter
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # imported but unused
# Typer declares flags as boolean parameters; help text uses emoji on purpose.
"domino_game/cli.py" = ["FBT001", "FBT003", "RUF001", "RUF002"]
# Blender's bpy API takes positional booleans.
"tools/*" = ["FBT003"]
# Tests spell tiles as D(6, 6) for readable fixtures.
"tests/*" = ["N817"]

[tool.ruff.lint.isort]
known-first-party = ["domino_game"]

[tool.mypy]
python_version = "3.9"
strict = true
files = ["domino_game", "tests", "main.py"]
warn_unreachable = true

# Tests may skip annotations, but their bodies are still type-checked.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

